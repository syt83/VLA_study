<svg aria-label="Transformer 구조 비교. 왼쪽은 Encoder-only로 입력 텍스트가 여러 Encoder Block을 거쳐 문장 임베딩이나 분류 출력으로 이어진다. 오른쪽은 Encoder-Decoder로 입력이 Encoder Stack을 거쳐 Context를 만들고, Decoder Stack은 시작 토큰과 이전 출력 토큰을 받아 Encoder Context를 참고하며 다음 토큰을 생성한다. 하단은 Decoder-only로 프롬프트가 여러 Decoder Block을 거쳐 다음 토큰을 순차 생성한다." data-d-component="svg" fill="currentColor" role="img" style="color:rgb(255, 255, 255)" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="260" rx="12" fill="#F8FAFC"/><rect x="18" y="18" width="132" height="92" rx="8" fill="#DBEAFE" stroke="#2563EB"/><text x="84" y="32" font-size="9" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" fill="#1D4ED8">Encoder-only</text><rect x="34" y="40" width="100" height="14" rx="3" fill="#FFFFFF" stroke="#93C5FD"/><text x="84" y="50" font-size="6" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1E40AF">Input Tokens</text><line x1="84" y1="54" x2="84" y2="60" stroke="#2563EB" stroke-width="1.5"/><rect x="34" y="60" width="100" height="28" rx="4" fill="#3B82F6"/><text x="84" y="71" font-size="7" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Encoder</text><text x="84" y="79" font-size="6" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#DBEAFE">Block × N</text><line x1="84" y1="88" x2="84" y2="94" stroke="#2563EB" stroke-width="1.5"/><rect x="34" y="94" width="100" height="10" rx="3" fill="#FFFFFF" stroke="#93C5FD"/><text x="84" y="101" font-size="6" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1E40AF">Embedding / Class</text><rect x="170" y="18" width="132" height="150" rx="8" fill="#F3E8FF" stroke="#7C3AED"/><text x="236" y="30" font-size="9" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" fill="#6D28D9">Encoder–Decoder</text><rect x="182" y="40" width="108" height="12" rx="3" fill="#FFFFFF" stroke="#C4B5FD"/><text x="236" 